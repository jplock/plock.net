baseURL: https://plock.net
locale: en-us
title: plock.net
pygmentsUseClasses: true
uglyurls: true
disablePathToLower: true
disableHugoGeneratorInject: true
disableKinds:
  - section
  - sitemap
  - taxonomy
  - term

permalinks:
  posts: "/:year/:month/:day/:filename"

markup:
  goldmark:
    renderer:
      unsafe: true
  tableOfContents:
    ordered: true

mediaTypes:
  text/gemini:
    suffixes:
      - gmi

outputFormats:
  gemtext:
    isPlainText: true
    isHTML: false
    mediaType: text/gemini
    protocol: "gemini://"
    permalinkable: true
  GEMRSS:
    baseName: posts
    isHTML: false
    mediaType: application/rss+xml
    protocol: "gemini://"

outputs:
  home:
    - gemtext
    - GEMRSS
  page:
    - gemtext
